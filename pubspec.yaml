name: epubx
description: Epub Parser for Dart, self-maintained fork of epubx with image 4 support. Suitable for use on the Server, the Web, or in Flutter.
homepage: https://github.com/ningpengtao-coder/dart-epub
version: 4.0.1

environment:
  sdk: ^3.10.7

dependencies:
  archive: ^3.6.1
  collection: ^1.19.0
  image: ^4.1.7
  quiver: ^3.2.2
  xml: ^6.6.1

dev_dependencies:
  lints: ^5.0.0
  path: ^1.9.1
  test: ^1.25.0
